<!doctype html>
<!--
  Babel Mercería · Sistema de gestión
  Página única (SPA): este archivo es la "cáscara"; todo el contenido se dibuja con JavaScript.

  Orden de carga de los scripts (importa, cada uno usa lo definido por el anterior):
    config.js → ui.js → api.js → pages/*.js → app.js
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babel Mercería</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Acá se dibuja cada pantalla (login o sistema) -->
  <div id="app"></div>

  <!-- Avisos flotantes (éxito / error) -->
  <div id="toasts" aria-live="polite"></div>

  <!-- 1. Configuración y utilidades -->
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>

  <!-- 2. Pantallas: cada archivo registra una página en el objeto `pages` -->
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/venta.js"></script>
  <script src="js/pages/ventas.js"></script>
  <script src="js/pages/productos.js"></script>
  <script src="js/pages/stock.js"></script>
  <script src="js/pages/compras.js"></script>
  <script src="js/pages/proveedores.js"></script>
  <script src="js/pages/reportes.js"></script>
  <script src="js/pages/config.js"></script>

  <!-- 3. Arranque: sesión, menú y rutas -->
  <script src="js/app.js"></script>
</body>
</html>
